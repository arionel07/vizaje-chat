name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vizaje-chat-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vizaje_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vizaje_chat_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Apply DB schema
        run: bunx drizzle-kit push --force
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: bun test

  admin:
    name: Admin (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vizaje-chat-admin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  widget:
    name: Widget (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check vizaje-chat-widget/widget.js
